[package]
name = "pal-desktop"
version = "0.1.0"
edition = "2021"
description = "仙剑奇侠传 Rust 版 - 桌面端入口"

[dependencies]
pal-core = { path = "../pal-core" }
pal-assets = { path = "../pal-assets" }
image = "0.24"
fontdue = "0.9"
encoding_rs = "0.8"
winit = { version = "0.29", default-features = false, features = ["rwh_05", "x11"] }
pixels = "0.14"
rodio = "0.19"
rustysynth = "1.3.6"
nuked-opl3 = "0.1.0"
